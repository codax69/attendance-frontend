worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging Settings
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;
    error_log   /var/log/nginx/error.log   warn;

    # Performance Optimizations
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens off; # Security: Hide Nginx version

    # Gzip Compression Settings
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # DNS resolver for dynamic domain resolution inside Docker container.
        # Uses Docker's internal DNS resolver (127.0.0.11) and fallbacks (Google/Cloudflare).
        # ipv6=off is configured because Docker networking is typically IPv4-only by default.
        resolver 127.0.0.11 8.8.8.8 1.1.1.1 ipv6=off valid=30s;

        # Root and SPA routing fallback
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        # Optimized cache headers for built static assets
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        # Cache headers for other static assets in public folder
        location ~* \.(?:ico|png|jpg|jpeg|gif|webp|svg|woff|woff2|ttf|eot|otf)$ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, emulate";
            access_log off;
        }

        # API Proxy (Forward requests starting with /api to backend service)
        location /api/ {
            # In Docker compose, the backend service is named 'backend'.
            # Storing the URL in a variable forces Nginx to resolve it at runtime
            # instead of failing to start if the backend service is not running yet.
            set $backend_upstream "http://backend:3000";
            proxy_pass $backend_upstream;
            
            # Standard proxy headers
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Google Sheets Macros Proxy
        location /macros/ {
            set $macros_upstream "https://script.google.com";
            rewrite ^/macros/(.*)$ /$1 break;
            proxy_pass $macros_upstream;

            proxy_ssl_server_name on;
            proxy_ssl_protocols TLSv1.2 TLSv1.3;
            proxy_set_header Host script.google.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # OpenWeatherMap API Proxy
        location /geo/ {
            set $geo_upstream "http://api.openweathermap.org";
            rewrite ^/geo/(.*)$ /$1 break;
            proxy_pass $geo_upstream;

            proxy_set_header Host api.openweathermap.org;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
